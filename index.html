<html>
<head>
    <title>Micronaut JavaScript SSE Demo</title>
    <link rel="stylesheet" type="text/css" href="therm.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        var source;

        function setupEventSource() {
            if (typeof(EventSource) !== "undefined") {
              // Close  already connected to avoid duplicated messages
              if (typeof(source) !== "undefined") {
                  source.close();
              }
              
              source = new EventSource("http://localhost:8080/eventpost/api/topic/temp1");
              
              source.onerror = function(event) {
                  console.log("SSE onerror " + event);
                  if ( event.target.readyState == 2 ) {
                      // Clean up and reestablish connection
                      try { 
                          source.close(); 
                      } catch ( err ) { }

                      setTimeout(function() { setupEventSource(); }, 1000); 
                  }
              }
              
              source.onopen = function() {
                  console.log("SSE onopen");
              }
              
              source.onmessage = function(event) {
                  console.log("SSE onmessage: " + event.data);
                  var tempGauge = document.getElementById('temperature');
                  tempGauge.innerHTML=event.data;
              }
          } 
          else {
            Alert("Error: Server-Sent Events are not supported in your browser");
          }
        }

        function onPageLoad() {
            setupEventSource();
        }
        
        window.addEventListener("load", onPageLoad, true);
    </script>
</head>
<body background="background_teal_radial.png">
	<label1>Micronaut JavaScript SSE Demo</label1>
    <table>
        <br>
        <br>
        <br>
        <br>
        <table width="100%">
            <tr>
                <td width="25%">
                	<div class="light-box">
                    <table>
	                    <tr>
	                        <td>
	                            <label1>Current Temperature:</label1>
	                        </td>
	                    </tr>
                    </table>
                    <table>
	                    <tr>
	                        <td>
	                            <div class="dark-box"><device-value id="temperature">0</device-value></div>
	                        </td>
	                        <td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
	                        <td>
	                            <label2>F</label2><br>
	                            <label3>&nbsp</label3>
	                        </td>
	                    </tr>
	                    <tr> </tr>
                    </table>
                	</div>
                </td>
                <td width="40px"></td>
            </tr>
        </table>
    </table>
</body>
</html>
