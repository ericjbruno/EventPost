<!--
  Topic sample, browser subscriber: a live stock price dashboard.

  Browsers can subscribe to EventPost directly with the built-in
  EventSource API. This page listens on the same "stocks" topic as
  StockWatcher, so start StockTicker.java to see prices move.

  Start the server from the project folder so it also serves this page:

    java -Dmicronaut.router.static-resources.samples.paths=file:sample-apps \
         '-Dmicronaut.router.static-resources.samples.mapping=/samples/**' \
         -jar target/EventPost-1.0-SNAPSHOT.jar

  Then open http://localhost:8080/samples/stock-dashboard.html. Add
  ?server=http://host:port to the page URL to use another server (that
  server needs CORS enabled).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #e3e6eb; --up: #15803d; --down: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2;
      --border: #2b313c; --up: #4ade80; --down: #f87171;
    }
  }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  #status { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  #status::before { content: "●"; margin-right: 6px; color: var(--muted); }
  #status.live::before { color: var(--up); }
  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  td.price { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  td.change { font-variant-numeric: tabular-nums; text-align: right; width: 90px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  svg { display: block; }
  polyline { fill: none; stroke: currentColor; stroke-width: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Stock Dashboard</h1>
  <p id="status">Connecting…</p>
  <table>
    <thead><tr><th>Symbol</th><th>Last 30 updates</th><th style="text-align:right">Price</th><th style="text-align:right">Change</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  // The page is served by EventPost, so the API is on the same origin
  const server = new URLSearchParams(location.search).get("server")
      || (location.protocol.startsWith("http") ? location.origin : "http://localhost:8080");
  const status = document.getElementById("status");
  const rows = document.getElementById("rows");
  const history = {};   // symbol -> recent prices

  // Subscribe to the "stocks" topic. Each message is one JSON object:
  // {"time":"14:03:05","AAPL":228.91,"MSFT":414.87,...}
  const events = new EventSource(server + "/eventpost/api/topic/stocks");

  events.onopen = () => {
    status.textContent = "Connected, waiting for prices…";
    status.className = "live";
  };
  events.onerror = () => {
    // EventSource reconnects on its own
    status.textContent = "Not connected to " + server + ", retrying…";
    status.className = "";
  };
  events.onmessage = (event) => {
    const update = JSON.parse(event.data);
    status.textContent = "Live, last update " + update.time;
    status.className = "live";

    for (const [symbol, price] of Object.entries(update)) {
      if (symbol === "time") continue;
      const prices = (history[symbol] ||= []);
      prices.push(price);
      if (prices.length > 30) prices.shift();
      render(symbol, prices);
    }
  };

  function render(symbol, prices) {
    let row = document.getElementById("row-" + symbol);
    if (!row) {
      row = rows.insertRow();
      row.id = "row-" + symbol;
      row.innerHTML = `<td><strong>${symbol}</strong></td><td class="spark"></td>` +
                      `<td class="price"></td><td class="change"></td>`;
    }

    const price = prices[prices.length - 1];
    const previous = prices.length > 1 ? prices[prices.length - 2] : price;
    const change = price - previous;
    const trend = change > 0 ? "up" : change < 0 ? "down" : "";

    row.querySelector(".price").textContent = price.toFixed(2);
    const changeCell = row.querySelector(".change");
    changeCell.textContent = (change > 0 ? "▲ " : change < 0 ? "▼ " : "") + Math.abs(change).toFixed(2);
    changeCell.className = "change " + trend;

    row.querySelector(".spark").innerHTML = sparkline(prices, trend);
  }

  // A small SVG line of recent prices, scaled to fit
  function sparkline(prices, trend) {
    const width = 140, height = 28;
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = max - min || 1;
    const points = prices.map((p, i) =>
      `${(i / 29) * width},${height - ((p - min) / range) * (height - 4) - 2}`).join(" ");
    return `<svg width="${width}" height="${height}" class="${trend}"><polyline points="${points}"/></svg>`;
  }
</script>
</body>
</html>
