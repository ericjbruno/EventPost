<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="t d">
  <title id="t">Choosing where queue messages are stored</title>
  <desc id="d">At startup, MessagePersistanceFactory reads two settings and creates one of three stores. NoHeapDB in memory, the default: message bodies off the Java heap, no database to run, lost when the server stops. NoHeapDB persisted: memory-mapped files in ~/JavaOffHeap, reloaded on restart, index rebuilt after a crash. Oracle NoSQL: a KV store at 127.0.0.1:5001, reloaded on restart, a separate database server.</desc>
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
      .ttl { font-size: 15px; font-weight: 600; }
      .sm, .sm text { font-size: 12px; fill: #374151; }
      .xs, .xs text { font-size: 11px; fill: #6b7280; }
      .mono, .mono text { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #1f2937; }
      .b { font-weight: 600; }
      .c { text-anchor: middle; }
      .factory { fill: #F0F9FF; stroke: #0369A1; stroke-width: 1.25; }
      .card { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1.5; }
      .card-default { fill: #F0FDF4; stroke: #15803D; stroke-width: 2; }
      .setting { fill: #ffffff; stroke: #BBF7D0; stroke-width: 1; }
      .badge { fill: #15803D; }
      .badget { fill: #ffffff; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-anchor: middle; }
      .arr { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .line { stroke: #374151; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="410" fill="#ffffff"/>

  <rect class="factory" x="300" y="20" width="360" height="70" rx="8"/>
  <text x="480" y="47" class="c b" style="font-family: Menlo, Consolas, monospace; font-size: 13px">MessagePersistanceFactory</text>
  <text x="480" y="67" class="xs c">reads two settings at startup and creates one store</text>

  <path class="line" d="M480,90 V112 M180,112 H780"/>
  <path class="arr" d="M180,112 V136"/>
  <path class="arr" d="M480,112 V136"/>
  <path class="arr" d="M780,112 V136"/>

  <!-- NoHeapDB in memory -->
  <rect class="card-default" x="40" y="138" width="280" height="232" rx="10"/>
  <text x="60" y="166" class="ttl">NoHeapDB, in memory</text>
  <rect class="badge" x="250" y="153" width="54" height="18" rx="9"/><text x="277" y="166" class="badget">DEFAULT</text>
  <rect class="setting" x="60" y="180" width="240" height="46" rx="6"/>
  <text x="72" y="199" class="mono">persistence=noheapdb</text>
  <text x="72" y="216" class="mono">noheapdb.storage=in_memory</text>
  <text x="60" y="254" class="sm">•  Message bodies kept off the Java heap</text>
  <text x="60" y="276" class="sm">•  No database to install or run</text>
  <text x="60" y="298" class="sm">•  Lost when the server stops</text>
  <text x="60" y="320" class="sm">•  Fast; good for development, tests</text>
  <text x="73" y="342" class="sm">and messages you can resend</text>

  <!-- NoHeapDB persisted -->
  <rect class="card" x="340" y="138" width="280" height="232" rx="10"/>
  <text x="360" y="166" class="ttl">NoHeapDB, persisted</text>
  <rect class="setting" x="360" y="180" width="240" height="46" rx="6"/>
  <text x="372" y="199" class="mono">persistence=noheapdb</text>
  <text x="372" y="216" class="mono">noheapdb.storage=persisted</text>
  <text x="360" y="254" class="sm">•  Memory-mapped files in ~/JavaOffHeap</text>
  <text x="360" y="276" class="sm">•  Reloaded when the server restarts</text>
  <text x="360" y="298" class="sm">•  Index rebuilt from the files after a crash</text>
  <text x="360" y="320" class="sm">•  Durable, and still runs in the same</text>
  <text x="373" y="342" class="sm">JVM as the server</text>

  <!-- Oracle NoSQL -->
  <rect class="card" x="640" y="138" width="280" height="232" rx="10"/>
  <text x="660" y="166" class="ttl">Oracle NoSQL Database</text>
  <rect class="setting" x="660" y="180" width="240" height="46" rx="6"/>
  <text x="672" y="199" class="mono">persistence=oraclekv</text>
  <text x="672" y="216" class="xs">KV store at 127.0.0.1:5001</text>
  <text x="660" y="254" class="sm">•  A separate database server</text>
  <text x="660" y="276" class="sm">•  Reloaded when the server restarts</text>
  <text x="660" y="298" class="sm">•  Must be running before EventPost</text>
  <text x="660" y="320" class="sm">•  For messages kept on dedicated</text>
  <text x="673" y="342" class="sm">database servers</text>

  <text x="40" y="396" class="xs">Settings are shown without their <tspan class="mono" style="font-size:11px">eventpost.</tspan> prefix. Each is a -D system property, or an environment variable such as EVENTPOST_PERSISTENCE.</text>
</svg>
