<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">The life of a queue message</title>
  <desc id="d">Sending: a POST arrives; processSend makes one message per data line; nextMessageId gives it a unique, increasing ID; saveMessage writes the body to storage; the ID joins the in-memory queue. Delivering: a receiver's handler waits for the next ID while checking the receiver is still connected, loads the body from storage, sends it as an SSE data event, and deletes it from storage; a message taken for a receiver that has gone is put back at the front of the queue. On restart, getMessageIds reloads the IDs still waiting in storage.</desc>
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
      .sm, .sm text { font-size: 12px; fill: #374151; }
      .xs, .xs text { font-size: 11px; fill: #6b7280; }
      .mono, .mono text { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
      .b { font-weight: 600; }
      .c { text-anchor: middle; }
      .step { fill: #ffffff; stroke: #0369A1; stroke-width: 1.25; }
      .send { fill: #F0F9FF; stroke: #7DD3FC; stroke-width: 1.25; }
      .restart { fill: #ffffff; stroke: #15803D; stroke-width: 1.25; stroke-dasharray: 4 3; }
      .store { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1.5; }
      .num { fill: #0369A1; }
      .numt { fill: #ffffff; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .arr { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
      .ref { stroke: #15803D; stroke-width: 1.25; fill: none; stroke-dasharray: 4 3; marker-end: url(#ah2); }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>

  <text x="20" y="34" class="sm b">Sending</text>
  <text x="80" y="34" class="xs">one POST; the response comes back after step 5</text>

  <!-- Row 1: sending, left to right -->
  <rect class="send" x="20" y="48" width="164" height="78" rx="6"/>
  <circle class="num" cx="38" cy="66" r="9"/><text x="38" y="70" class="numt">1</text>
  <text x="102" y="92" class="mono c b">POST</text>
  <text x="102" y="110" class="xs c">/queue/publish?name=…</text>

  <rect class="step" x="208" y="48" width="164" height="78" rx="6"/>
  <circle class="num" cx="226" cy="66" r="9"/><text x="226" y="70" class="numt">2</text>
  <text x="290" y="92" class="mono c b">processSend()</text>
  <text x="290" y="110" class="xs c">one message per data: line</text>

  <rect class="step" x="396" y="48" width="164" height="78" rx="6"/>
  <circle class="num" cx="414" cy="66" r="9"/><text x="414" y="70" class="numt">3</text>
  <text x="478" y="92" class="mono c b">nextMessageId()</text>
  <text x="478" y="110" class="xs c">unique and increasing</text>

  <rect class="step" x="584" y="48" width="164" height="78" rx="6"/>
  <circle class="num" cx="602" cy="66" r="9"/><text x="602" y="70" class="numt">4</text>
  <text x="666" y="92" class="mono c b">saveMessage()</text>
  <text x="666" y="110" class="xs c">the body goes to storage</text>

  <rect class="step" x="772" y="48" width="164" height="78" rx="6"/>
  <circle class="num" cx="790" cy="66" r="9"/><text x="790" y="70" class="numt">5</text>
  <text x="854" y="92" class="mono c b">messageIds.add()</text>
  <text x="854" y="110" class="xs c">the ID joins the queue</text>

  <path class="arr" d="M184,87 H206"/>
  <path class="arr" d="M372,87 H394"/>
  <path class="arr" d="M560,87 H582"/>
  <path class="arr" d="M748,87 H770"/>

  <!-- Storage -->
  <rect class="store" x="20" y="156" width="728" height="50" rx="8"/>
  <text x="40" y="178" class="b">Storage</text>
  <text x="100" y="178" class="sm">the <tspan class="mono">MessagePersistance</tspan> interface</text>
  <text x="40" y="195" class="xs">NoHeapDB, in memory or persisted, or Oracle NoSQL, chosen at startup; keyed by queue name and message ID</text>

  <path class="arr" d="M650,126 V154"/>
  <path class="arr" d="M682,206 V234"/>
  <path class="arr" d="M290,236 V208"/>
  <path class="ref" d="M102,206 V234"/>

  <!-- Row 2: delivering, right to left -->
  <path class="arr" d="M854,126 V234"/>

  <rect class="step" x="772" y="236" width="164" height="78" rx="6"/>
  <circle class="num" cx="790" cy="254" r="9"/><text x="790" y="258" class="numt">6</text>
  <text x="854" y="280" class="mono c b">pollNextMessage()</text>
  <text x="854" y="298" class="xs c">waits, checking the receiver</text>

  <rect class="step" x="584" y="236" width="164" height="78" rx="6"/>
  <circle class="num" cx="602" cy="254" r="9"/><text x="602" y="258" class="numt">7</text>
  <text x="666" y="280" class="mono c b">getMessage()</text>
  <text x="666" y="298" class="xs c">the body comes back</text>

  <rect class="step" x="396" y="236" width="164" height="78" rx="6"/>
  <circle class="num" cx="414" cy="254" r="9"/><text x="414" y="258" class="numt">8</text>
  <text x="478" y="280" class="mono c b">emitter.onNext()</text>
  <text x="478" y="298" class="xs c">sent as a data: event</text>

  <rect class="step" x="208" y="236" width="164" height="78" rx="6"/>
  <circle class="num" cx="226" cy="254" r="9"/><text x="226" y="258" class="numt">9</text>
  <text x="290" y="280" class="mono c b">deleteMessage()</text>
  <text x="290" y="298" class="xs c">removed from storage</text>

  <rect class="restart" x="20" y="236" width="164" height="78" rx="6"/>
  <text x="102" y="262" class="b c">On restart</text>
  <text x="102" y="282" class="mono c" style="font-size:11px">getMessageIds()</text>
  <text x="102" y="299" class="xs c">reloads the waiting IDs</text>

  <path class="arr" d="M772,275 H750"/>
  <path class="arr" d="M584,275 H562"/>
  <path class="arr" d="M396,275 H374"/>

  <text x="208" y="342" class="sm b">Delivering</text>
  <text x="282" y="342" class="xs">one handler per receiver; a message taken for a receiver that has gone goes back to the front</text>
</svg>
